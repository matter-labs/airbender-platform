[package]
name = "airbender-crypto-c"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "C ABI for Airbender cryptographic accelerators"

# The C archive is built with `cargo rustc --crate-type staticlib` (see the README):
# Cargo builds every listed crate type for dependents too, which would make Rust
# guests depending on this crate link a standalone archive.
[lib]
crate-type = ["rlib"]

[dependencies]
airbender-crypto = { path = "../airbender-crypto", features = ["alloc"] }

[target.'cfg(target_arch = "riscv32")'.dependencies]
airbender-rt = { path = "../airbender-rt", optional = true, default-features = false, features = ["allocator-talc", "external-startup"] }

[features]
default = []
# RV32 only (requires `delegation`): the exports take checked hints through the
# non-determinism CSR, from a tape that a native build recorded. Native builds record
# through the C recording API instead, and ignore this feature.
csr-oracle = []
# RV32 only: delegated big-integer arithmetic. Native builds record the hints of a
# delegation build without it.
delegation = ["airbender-crypto/proving"]
# RV32 only: use airbender-rt's Talc allocator and panic/OOM handlers, with a
# C heap-initialization entry point. Leave off when the embedding Rust guest
# already includes and initializes airbender-rt.
c-runtime = ["dep:airbender-rt"]
