[package]
name = "airbender-crypto-c"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "C ABI for Airbender cryptographic accelerators"

# The C archive is built with `cargo rustc --crate-type staticlib`; listing it here would build
# it for every Rust dependent too.
[lib]
crate-type = ["rlib"]

[dependencies]
airbender-crypto = { path = "../airbender-crypto", features = ["alloc"] }

[target.'cfg(target_arch = "riscv32")'.dependencies]
airbender-oracle = { path = "../airbender-oracle" }
airbender-rt = { path = "../airbender-rt", optional = true, default-features = false, features = ["allocator-talc", "external-startup"] }

[features]
default = []
# RV32 only (requires `delegation`): hints through the non-determinism CSR, from a tape recorded
# natively. Native builds ignore it.
csr-oracle = []
# RV32 only: delegated big-integer arithmetic.
delegation = ["airbender-crypto/proving"]
# RV32 only: airbender-rt's allocator and panic handlers for C guests, with
# `airbender_crypto_init_heap`. Leave off in Rust guests that start through airbender-rt.
c-runtime = ["dep:airbender-rt"]
