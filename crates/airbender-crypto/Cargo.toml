[package]
name = "airbender-crypto"
version.workspace = true
edition.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Shared crypto primitives for Airbender host and guest programs"
readme = "README.md"

[dependencies]
airbender-oracle = { path = "../airbender-oracle" }
common_constants = { workspace = true }
riscv_common = { workspace = true }
blake2 = { workspace = true }
sha3 = { workspace = true }
sha2 = { workspace = true }
k256 =  { workspace = true, features = ["ecdsa-core", "ecdsa", "arithmetic"] }
p256 =  { workspace = true, features = ["ecdsa-core", "ecdsa", "arithmetic"] }
blake2s_u32 = { workspace = true, optional = true }
ripemd = { workspace = true }
ruint = { workspace = true }

seq-macro = { workspace = true }
cfg-if = { workspace = true }
const_for = { workspace = true }

# zeroize = { version = "1", default-features = false, optional = true }
# num-traits = { version = "0.2", default-features = false, optional = true }
# num-bigint = { version = "0.4", default-features = false, optional = true }
# num-integer = { version = "0.1", default-features = false, optional = true }

ark-std = { workspace = true }
ark-ff = { workspace = true }
ark-ec = { workspace = true }
ark-serialize = { workspace = true }
ark-bn254 = { workspace = true, features = ["curve", "scalar_field"] }
ark-bls12-381 = { workspace = true, features = ["curve", "scalar_field"] }
num-bigint = { workspace = true }
zeroize = { workspace = true }
itertools = { workspace = true }
educe = { workspace = true }
num-traits = { workspace = true }

# ark-ff = { path = "../../git_copies/algebra/ff", default-features = false }
# ark-ec = { path = "../../git_copies/algebra/ec", default-features = false }
# ark-serialize = { path = "../../git_copies/algebra/serialize", default-features = false }
# ark-bn254 = { path = "../../git_copies/algebra/curves/bn254", default-features = false, features = ["curve", "scalar_field"] }
# ark-bls12-381 = { path = "../../git_copies/algebra/curves/bls12_381", default-features = false, features = ["curve", "scalar_field"] }

[dev-dependencies]
# The oracle side (`airbender_oracle::QuerierMemory` and the simulator crate behind it), which
# the unit tests use without `oracle_implementations`
airbender-oracle = { path = "../airbender-oracle", features = ["oracle_processor"] }
ruint = { workspace = true }
ark-std = { workspace = true, features = ["std"] }
zeroize = { workspace = true }
num-traits = { workspace = true }
num-bigint = { workspace = true }
num-integer = { workspace = true }
proptest = { workspace = true, features = ["std"] }
hex-literal = { workspace = true }
ark-test-curves = { workspace = true, features = ["secp256k1", "bls12_381_curve"] }
rand_core = { workspace = true, features = ["getrandom"] }
rand_chacha = { workspace = true }
# The permutation behind `sha3` (already in the lock file), for the host tests of `sha3::rv64`
keccak = { version = "0.1", default-features = false }

[features]
# forward = ["blake2"]
forward = []
proving = [
    "single_round_with_control",
    "bigint_ops",
    "hinted_operations",
    "secp256k1-static-context",
    "keccak_special5",
]
default = ["forward", "secp256k1-static-context", "hinted_operations"]
# The hinted paths of the primitives: the oracle witnesses (`hints`) in the recovery, the pairing
# checks, the MSMs, KZG and ModExp. Independent of `bigint_ops`: the answers are read in the
# representation of the fields of the build.
hinted_operations = []
# The oracle side on a native host: the implementations that compute the witnesses
# (`*/oracle_implementations`, `oracle_common`), which allocate, and the recorder of the hint
# tape. They read the querier's memory through Airbender's `QuerierMemory`, which lives in its
# simulator crate (`riscv_transpiler::oracle`, through `airbender-oracle/oracle_processor`): a
# host-only dependency, never a guest's.
oracle_implementations = ["hinted_operations", "alloc", "airbender-oracle/oracle_processor"]
# The oracle side as a responder of the oracle protocol (`CryptoHints`, an
# `OracleQueryProcessor` of `riscv_transpiler::oracle`), which a host registers with its
# `QueryDispatcher`.
oracle_processor = ["oracle_implementations"]
# bigint_ops = ["zeroize", "num-bigint", "num-traits", "num-integer"]
# The bigint delegation of the RV32 guest for the field arithmetic. On a host it is emulated in
# software, with the same representations: the RV32 code runs and is tested natively. Never in
# force on `riscv64` (see `build.rs`).
bigint_ops = []
keccak_special5 = []
single_round_with_control = ["blake2s_u32/blake2_with_compression"]
blake2s_tests = []
secp256k1-static-context = []
# Experimental: evmone-like structure of the ecrecover's multi-scalar multiplication (fixed windows for G,
# joint NAF for the recovered point). Applies to the delegation-based field (`bigint_ops`) only.
secp256k1-shamir-msm = []
# The allocating endpoints (the pairing checks and the MSMs) and `ECMultContext::new_in`
alloc = []
sha3_tests = []
testing = []
