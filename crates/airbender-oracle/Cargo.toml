[package]
name = "airbender-oracle"
version.workspace = true
edition.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true
description = "The oracle protocol of Airbender guests: query IDs and the querier side of the memory-based protocol"

[dependencies]
# The oracle side on the host (`oracle_processor`), which Airbender's simulator crate defines
riscv_transpiler = { workspace = true, optional = true }

[target.'cfg(target_arch = "riscv32")'.dependencies]
riscv_common = { workspace = true }

[features]
default = []
# The oracle side on the host (`std`), re-exported from `riscv_transpiler::oracle`: the
# dispatcher, the responder trait, the querier's memory and the system query IDs, and
# `MemoryOracle` for a querier in this process on top of them. Not for guests: it pulls in the
# simulator crate.
oracle_processor = ["dep:riscv_transpiler"]
