[package]
name = "airbender-host"
version.workspace = true
edition.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Host-side APIs for executing, proving, and verifying Airbender programs"
readme = "README.md"

[features]
default = ["gpu-prover"]
gpu-prover = ["prover_pipeline/gpu"]

[dependencies]
airbender-core = { path = "../airbender-core" }
airbender-codec = { path = "../airbender-codec" }
serde = { workspace = true, features = ["derive"] }
prover_pipeline = { workspace = true }
riscv_transpiler = { workspace = true, features = ["jit", "flamegraph"] }
riscv_common = { workspace = true }
field = { workspace = true }
sha3 = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
sysinfo = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
