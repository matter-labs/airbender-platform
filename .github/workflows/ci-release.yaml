name: ci-release

on:
  workflow_call:
    inputs:
      tag:
        description: 'Git tag to release.'
        required: true
        type: string
      prerelease_name:
        description: 'Suffix for a manual pre-release (blank = full release)'
        required: false
        type: string
        default: ''
      push_docker_image:
        description: 'Push the cargo-airbender Docker images to GHCR'
        required: false
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      tag:
        description: 'Git tag to release.'
        required: true
        type: string
      prerelease_name:
        description: 'Suffix for a manual pre-release (blank = full release)'
        required: false
        type: string
        default: ''
      push_docker_image:
        description: 'Push the cargo-airbender Docker images to GHCR'
        required: false
        type: boolean
        default: true

permissions: {}

concurrency:
  group: release-${{ inputs.tag || github.run_id }}
  cancel-in-progress: false

defaults:
  run:
    shell: 'bash -ex {0}'

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare-release:
    name: Sync release metadata
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    outputs:
      tag_name: ${{ steps.release_info.outputs.tag_name }}
      version_name: ${{ steps.release_info.outputs.version_name }}
    steps:
      - name: Validate release tag
        id: release_info
        env:
          TAG_NAME: ${{ inputs.tag }}
        run: |
          if [[ -z "${TAG_NAME}" ]]; then
            echo "Release tag is required."
            exit 1
          fi

          if [[ ! "${TAG_NAME}" =~ ^[A-Za-z0-9.-]+$ ]]; then
            echo "Release tag '${TAG_NAME}' contains unsupported characters."
            echo "Only alphanumeric characters, dots, and dashes are allowed."
            exit 1
          fi

          echo "tag_name=${TAG_NAME}" >> "${GITHUB_OUTPUT}"
          echo "version_name=${TAG_NAME}" >> "${GITHUB_OUTPUT}"

      - name: Update release-please release artifacts
        if: ${{ inputs.prerelease_name == '' }}
        uses: softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b # v2.5.0
        with:
          tag_name: ${{ inputs.tag }}

      - name: Update manual pre-release metadata
        if: ${{ inputs.prerelease_name != '' }}
        uses: softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b # v2.5.0
        with:
          tag_name: ${{ inputs.tag }}
          name: airbender-platform ${{ inputs.tag }}${{ inputs.prerelease_name && format(' {0}', inputs.prerelease_name) || '' }}
          target_commitish: ${{ github.sha }}
          prerelease: true

  release-cargo-airbender-image:
    name: Build ${{ matrix.image_name }} Docker image
    runs-on: matterlabs-ci-runner-high-performance
    needs:
      - prepare-release
    if: ${{ inputs.push_docker_image }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image_name: cargo-airbender
            dockerfile: docker/cargo-airbender/Dockerfile
            build_args: ''
          - image_name: cargo-airbender-cuda
            dockerfile: docker/cargo-airbender/Dockerfile.cuda
            build_args: |
              CUDA_ARCH=80;89;90
    steps:
      - name: Checkout sources
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ inputs.tag }}

      - name: Build and push Docker image
        uses: ./.github/actions/publish-docker-image
        with:
          image_name: ${{ matrix.image_name }}
          dockerfile: ${{ matrix.dockerfile }}
          tag: ${{ inputs.tag }}
          registry_username: ${{ github.actor }}
          registry_password: ${{ secrets.GITHUB_TOKEN }}
          build_args: ${{ matrix.build_args }}

  build-man:
    name: Build man page
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - prepare-release
    permissions:
      contents: read
    outputs:
      man_file: ${{ steps.man.outputs.man_file }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ inputs.tag }}

      - uses: moonrepo/setup-rust@v1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          cache: false

      - name: Build debug binary
        run: cargo build --no-default-features --bin cargo-airbender

      - name: Build man page
        id: man
        env:
          VERSION_NAME: ${{ needs.prepare-release.outputs.version_name }}
        run: |
          sudo apt-get -y install help2man
          help2man -N ./target/debug/cargo-airbender > cargo-airbender.1
          gzip cargo-airbender.1
          tar -czvf "airbender_platform_man_${VERSION_NAME}.tar.gz" cargo-airbender.1.gz
          echo "man_file=airbender_platform_man_${VERSION_NAME}.tar.gz" >> "${GITHUB_OUTPUT}"

      - uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.man.outputs.man_file }}
          path: ${{ steps.man.outputs.man_file }}
          retention-days: 1

  build-binaries:
    name: Build ${{ matrix.target }} (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    needs:
      - prepare-release
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: matterlabs-ci-runner-high-performance
            target: x86_64-unknown-linux-gnu
            svm_target_platform: linux-amd64
            platform: linux
            arch: amd64
          - runner: matterlabs-ci-runner-arm
            target: aarch64-unknown-linux-gnu
            svm_target_platform: linux-aarch64
            platform: linux
            arch: arm64
          - runner: macos-latest
            target: aarch64-apple-darwin
            svm_target_platform: macosx-aarch64
            platform: darwin
            arch: arm64
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ inputs.tag }}

      - name: Install Rust toolchain
        uses: moonrepo/setup-rust@v1
        env:
          # To fix rate limiting issues with GitHub API.
          GITHUB_TOKEN: ${{ github.token }}
        with:
          targets: ${{ matrix.target }}
          cache: false

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
          cache-on-failure: true

      - name: Apple M1 setup
        if: matrix.target == 'aarch64-apple-darwin'
        run: |
          brew install make
          echo "PATH=/usr/local/opt/make/libexec/gnubin:${PATH}" >> "${GITHUB_ENV}"
          echo "SDKROOT=$(xcrun -sdk macosx --show-sdk-path)" >> "${GITHUB_ENV}"
          echo "MACOSX_DEPLOYMENT_TARGET=$(xcrun -sdk macosx --show-sdk-platform-version)" >> "${GITHUB_ENV}"

      - name: Build binaries
        env:
          TAG_NAME: ${{ needs.prepare-release.outputs.tag_name }}
          SVM_TARGET_PLATFORM: ${{ matrix.svm_target_platform }}
        run: |
          target="${{ matrix.target }}"

          cargo build --release --no-default-features --target "${target}" --bin cargo-airbender

          bin="./target/${target}/release/cargo-airbender"
          file "${bin}" || true
          ldd "${bin}" || true
          "${bin}" --version || true
          echo "bin_path=${bin}" >> "${GITHUB_ENV}"

      - name: Archive binaries
        id: artifacts
        env:
          PLATFORM_NAME: ${{ matrix.platform }}
          TARGET: ${{ matrix.target }}
          ARCH: ${{ matrix.arch }}
          VERSION_NAME: ${{ needs.prepare-release.outputs.version_name }}
        run: |
          if [[ "${PLATFORM_NAME}" == "linux" ]]; then
            tar -czvf "airbender_platform_${VERSION_NAME}_${PLATFORM_NAME}_${ARCH}.tar.gz" -C "./target/${TARGET}/release" cargo-airbender
            echo "file_name=airbender_platform_${VERSION_NAME}_${PLATFORM_NAME}_${ARCH}.tar.gz" >> "${GITHUB_OUTPUT}"
          elif [[ "${PLATFORM_NAME}" == "darwin" ]]; then
            # We need to use gtar here otherwise the archive is corrupt.
            # See: https://github.com/actions/virtual-environments/issues/2619
            gtar -czvf "airbender_platform_${VERSION_NAME}_${PLATFORM_NAME}_${ARCH}.tar.gz" -C "./target/${TARGET}/release" cargo-airbender
            echo "file_name=airbender_platform_${VERSION_NAME}_${PLATFORM_NAME}_${ARCH}.tar.gz" >> "${GITHUB_OUTPUT}"
          fi

          echo "attestation_file=airbender_platform_${VERSION_NAME}_${PLATFORM_NAME}_${ARCH}.attestation.txt" >> "${GITHUB_OUTPUT}"

      - name: Binaries attestation
        id: attestation
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: ${{ env.bin_path }}

      - name: Record attestation URL
        env:
          ATTESTATION_URL: ${{ steps.attestation.outputs.attestation-url }}
          ATTESTATION_FILE: ${{ steps.artifacts.outputs.attestation_file }}
        run: printf '%s\n' "${ATTESTATION_URL}" > "${ATTESTATION_FILE}"

      - name: Upload release assets
        uses: actions/upload-artifact@v6
        with:
          retention-days: 1
          name: ${{ matrix.target }}-release-assets
          path: |
            ${{ steps.artifacts.outputs.file_name }}
            ${{ steps.artifacts.outputs.attestation_file }}

  publish-release-assets:
    name: Attach release assets
    runs-on: ubuntu-latest
    needs:
      - prepare-release
      - build-man
      - build-binaries
    permissions:
      contents: write
    steps:
      - name: Download release assets
        uses: actions/download-artifact@v6
        with:
          path: release-assets
          merge-multiple: true

      - name: Print release assets
        run: find release-assets -maxdepth 1 -type f -print

      - name: Attach release assets
        uses: softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b # v2.5.0
        with:
          tag_name: ${{ needs.prepare-release.outputs.tag_name }}
          files: release-assets/*

  retry-on-failure:
    permissions:
      actions: write
    if: failure() && fromJSON(github.run_attempt) < 3
    needs:
      - prepare-release
      - build-man
      - build-binaries
      - publish-release-assets
      - release-cargo-airbender-image
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run retry.yml -F run_id=${{ github.run_id }}

  # Send a Slack notification on workflow failure.
  notify-failure:
    if: failure() && fromJSON(github.run_attempt) >= 3
    name: Notify failure via Slack
    runs-on: ubuntu-latest
    needs:
      - prepare-release
      - build-man
      - build-binaries
      - publish-release-assets
      - release-cargo-airbender-image
    steps:
      - name: Send Slack notification
        uses: slackapi/slack-github-action@v2
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": ":x: Release workflow failed after 3 attempts.\n${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }
